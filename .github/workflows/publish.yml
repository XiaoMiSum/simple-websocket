name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use pom.xml version)'
        required: false
        default: ''

# 流水线对仓库只读：不 commit、不 push、不打 tag，版本一律以 pom.xml 为准
permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # 使用手动输入的版本（仅修改流水线工作区，不回写仓库）
            mvn -q versions:set -DnewVersion="$INPUT_VERSION" -DgenerateBackupPoms=false
            VERSION="$INPUT_VERSION"
          else
            # 未填写时以 pom.xml 中的版本为准
            VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing io.github.xiaomisum:simple-websocket:${VERSION}"

      - name: Validate GPG key secret
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY is empty or not set"
            exit 1
          fi
          if printf '%s' "${GPG_PRIVATE_KEY}" | grep -q -- "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "GPG_PRIVATE_KEY armored format OK"
          elif printf '%s' "${GPG_PRIVATE_KEY}" | base64 -d 2>/dev/null | grep -q -- "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "GPG_PRIVATE_KEY base64 format OK"
          else
            echo "::error::Secret GPG_PRIVATE_KEY does not contain a complete private key (missing 'BEGIN PGP PRIVATE KEY BLOCK'). Re-export with: gpg --export-secret-keys --armor <FINGERPRINT> and update the secret."
            exit 1
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build and Test
        run: mvn clean test

      - name: Package
        run: mvn package -DskipTests

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Create settings.xml with server credentials
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
              <server>
                <id>sonatype-nexus</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>gpg</id>
                <properties>
                  <gpg.passphrase>${GPG_PASSPHRASE}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>gpg</activeProfile>
            </activeProfiles>
          </settings>
          EOF

          # Deploy to Maven Central
          mvn deploy -P release -DskipTests
